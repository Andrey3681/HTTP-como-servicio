#cloud-config
hostname: apache-server

# 1. CREACIÓN DEL USUARIO
users:
  - name: @@USUARIO@@
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: '@@CONTRASENA@@'
    ssh_authorized_keys:
      - @@SSH_KEY@@

# 0. RED: ambos adaptadores por DHCP (NAT para paquetes, host-only para servicio)
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: true
      optional: true
    enp0s8:
      dhcp4: true
      optional: true

# 2. HABILITAR REPOSITORIOS
apt:
  sources:
    debian:
      source: "deb http://deb.debian.org/debian/ trixie main contrib non-free non-free-firmware"

# 3. PAQUETES
packages:
  - apache2
  - unzip
  - virtualbox-guest-additions-iso
  - bzip2
  - tar
  - build-essential
  - linux-headers-amd64

# 4. COMANDOS FINALES
runcmd:
  - a2enmod vhost_alias
  - a2enmod rewrite
  - a2enmod headers
  - systemctl restart apache2
  # Cabeceras del kernel en ejecución (necesarias para compilar Guest Additions)
  - apt-get install -y "linux-headers-$(uname -r)" || true
  # Instalación de Guest Additions
  - mkdir -p /mnt/cdrom
  - mount -o loop /usr/share/virtualbox/VBoxGuestAdditions.iso /mnt/cdrom
  - /mnt/cdrom/VBoxLinuxAdditions.run --nox11 || true
  - umount /mnt/cdrom
