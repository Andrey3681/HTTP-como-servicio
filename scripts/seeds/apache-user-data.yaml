#cloud-config
hostname: apache-server

# 0. RED: netplan explícito para los dos adaptadores. host-only lleva el
# servicio; NAT solo existe durante la preparación para descargar paquetes.
# Se desactiva IPv6 en NAT: VirtualBox anuncia una ruta IPv6 sin salida real.
network:
  config: disabled

bootcmd:
  - |
    cat > /etc/netplan/99-httpaas.yaml <<'NETPLAN'
    network:
      version: 2
      renderer: networkd
      ethernets:
        enp0s3:
          dhcp4: false
          addresses: ["@@CIDR_ESTATICO@@"]
          optional: true
        enp0s8:
          dhcp4: true
          dhcp6: false
          accept-ra: false
          optional: true
    NETPLAN
    chmod 600 /etc/netplan/99-httpaas.yaml
    netplan apply

# 0.1 APT: solo IPv4 (el NAT no enruta IPv6) para evitar esperas largas.
write_files:
  - path: /etc/netplan/99-httpaas.yaml
    permissions: "0600"
    content: |
      network:
        version: 2
        renderer: networkd
        ethernets:
          enp0s3:
            dhcp4: false
            addresses: ["@@CIDR_ESTATICO@@"]
            optional: true
          enp0s8:
            dhcp4: true
            dhcp6: false
            accept-ra: false
            optional: true
  - path: /etc/apt/apt.conf.d/99force-ipv4
    permissions: "0644"
    content: |
      Acquire::ForceIPv4 "true";
  - path: /etc/apt/sources.list.d/debian.sources
    permissions: "0644"
    content: |
      Types: deb
      URIs: http://deb.debian.org/debian
      Suites: trixie trixie-updates
      Components: main
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
  - path: /etc/apt/sources.list.d/debian-security.sources
    permissions: "0644"
    content: |
      Types: deb
      URIs: http://deb.debian.org/debian-security
      Suites: trixie-security
      Components: main
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

# 1. CREACIÓN DEL USUARIO
users:
  - name: @@USUARIO@@
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: '@@CONTRASENA@@'
    ssh_authorized_keys:
      - "@@SSH_KEY@@"

# 3. PAQUETES
packages:
  - apache2
  - unzip

# 4. COMANDOS FINALES
runcmd:
  - a2enmod vhost_alias
  - a2enmod rewrite
  - a2enmod headers
  - systemctl restart apache2
  # El netplan de cloud-init fija la MAC de la plantilla; las instancias tienen
  # otra MAC y quedarían sin red. Se conserva solo el netplan por nombre.
  - rm -f /etc/netplan/50-cloud-init.yaml
  - netplan apply
