<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="680" xmlns="http://www.w3.org/2000/svg">
  <title>Diagrama de Secuencia - Flujo de Aprovisionamiento HTTPaaS</title>
  <defs>
    <marker id="arrowseq" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="900" height="680" fill="#ffffff"/>

  <!-- Participantes -->
  <rect x="30" y="30" width="90" height="35" fill="none" stroke="#000000"/>
  <text x="75" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Usuario</text>
  <line x1="75" y1="65" x2="75" y2="640" stroke="#000000" stroke-dasharray="4,3"/>

  <rect x="150" y="30" width="90" height="35" fill="none" stroke="#000000"/>
  <text x="195" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Web / API</text>
  <line x1="195" y1="65" x2="195" y2="640" stroke="#000000" stroke-dasharray="4,3"/>

  <rect x="270" y="30" width="110" height="35" fill="none" stroke="#000000"/>
  <text x="325" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Orquestador</text>
  <line x1="325" y1="65" x2="325" y2="640" stroke="#000000" stroke-dasharray="4,3"/>

  <rect x="410" y="30" width="100" height="35" fill="none" stroke="#000000"/>
  <text x="460" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">VirtualBox</text>
  <line x1="460" y1="65" x2="460" y2="640" stroke="#000000" stroke-dasharray="4,3"/>

  <rect x="540" y="30" width="100" height="35" fill="none" stroke="#000000"/>
  <text x="590" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Bind9 (DNS)</text>
  <line x1="590" y1="65" x2="590" y2="640" stroke="#000000" stroke-dasharray="4,3"/>

  <rect x="670" y="30" width="100" height="35" fill="none" stroke="#000000"/>
  <text x="720" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Deployer</text>
  <line x1="720" y1="65" x2="720" y2="640" stroke="#000000" stroke-dasharray="4,3"/>

  <!-- Mensajes -->
  <line x1="75" y1="95" x2="195" y2="95" stroke="#000000" marker-end="url(#arrowseq)"/>
  <text x="135" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">1. POST /api/instancias (nombre, .zip)</text>

  <line x1="195" y1="120" x2="325" y2="120" stroke="#000000" marker-end="url(#arrowseq)"/>
  <text x="260" y="115" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">2. Validar entrada</text>

  <line x1="195" y1="145" x2="325" y2="145" stroke="#000000" marker-end="url(#arrowseq)"/>
  <text x="260" y="140" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">3. Solicitar aprovisionamiento</text>

  <line x1="325" y1="175" x2="460" y2="175" stroke="#000000" marker-end="url(#arrowseq)"/>
  <text x="392" y="170" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">4. Crear VM desde disco multiattach</text>

  <line x1="460" y1="200" x2="325" y2="200" stroke="#000000" stroke-dasharray="4,2" marker-end="url(#arrowseq)"/>
  <text x="392" y="195" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">5. VM creada</text>

  <line x1="325" y1="225" x2="460" y2="225" stroke="#000000" marker-end="url(#arrowseq)"/>
  <text x="392" y="220" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">6. Iniciar VM</text>

  <line x1="325" y1="250" x2="460" y2="250" stroke="#000000" marker-end="url(#arrowseq)"/>
  <text x="392" y="245" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">7. Obtener IP via Guest Additions</text>

  <line x1="460" y1="275" x2="325" y2="275" stroke="#000000" stroke-dasharray="4,2" marker-end="url(#arrowseq)"/>
  <text x="392" y="270" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">8. IP 192.168.10.x</text>

  <line x1="325" y1="305" x2="590" y2="305" stroke="#000000" marker-end="url(#arrowseq)"/>
  <text x="457" y="300" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">9. Actualizar zona DNS - registro A &lt;host&gt;.cloud.local</text>

  <line x1="590" y1="330" x2="325" y2="330" stroke="#000000" stroke-dasharray="4,2" marker-end="url(#arrowseq)"/>
  <text x="457" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">10. Registro DNS OK</text>

  <line x1="325" y1="360" x2="720" y2="360" stroke="#000000" marker-end="url(#arrowseq)"/>
  <text x="522" y="355" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">11. Desplegar contenido .zip en /var/www/html/</text>

  <line x1="720" y1="385" x2="325" y2="385" stroke="#000000" stroke-dasharray="4,2" marker-end="url(#arrowseq)"/>
  <text x="522" y="380" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">12. Despliegue completado</text>

  <line x1="325" y1="415" x2="195" y2="415" stroke="#000000" marker-end="url(#arrowseq)"/>
  <text x="260" y="410" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">13. Persistir instancia</text>

  <line x1="325" y1="440" x2="195" y2="440" stroke="#000000" stroke-dasharray="4,2" marker-end="url(#arrowseq)"/>
  <text x="260" y="435" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">14. Instancia en estado RUNNING</text>

  <line x1="195" y1="470" x2="75" y2="470" stroke="#000000" stroke-dasharray="4,2" marker-end="url(#arrowseq)"/>
  <text x="135" y="465" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">15. Respuesta 201 Created con http://&lt;host&gt;.cloud.local</text>
</svg>
