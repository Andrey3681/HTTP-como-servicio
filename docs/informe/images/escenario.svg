<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="550" xmlns="http://www.w3.org/2000/svg">
  <title>Diagrama de Escenario - HTTPaaS</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="850" height="550" fill="#ffffff"/>

  <!-- Host -->
  <rect x="325" y="30" width="200" height="70" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="425" y="52" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">EQUIPO ANFITRIÓN</text>
  <text x="425" y="68" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">VirtualBox</text>
  <text x="425" y="84" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Orquestador HTTPaaS (Go)</text>

  <!-- Red cloudnet -->
  <rect x="40" y="140" width="770" height="370" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="50" y="158" font-family="Arial, sans-serif" font-size="10">Red interna: cloudnet - 192.168.10.0/24</text>

  <!-- Interfaz host-only -->
  <text x="425" y="128" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">eth0 / host-only 192.168.10.1</text>
  <line x1="425" y1="100" x2="425" y2="140" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- VM DNS -->
  <rect x="90" y="210" width="190" height="80" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="185" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">VM DNS - ns</text>
  <text x="185" y="246" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Debian 13 (CLI)</text>
  <text x="185" y="262" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Bind9</text>
  <text x="185" y="278" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">192.168.10.10/24 - zona cloud.local.</text>

  <!-- Plantilla ApacheServer -->
  <rect x="330" y="210" width="190" height="80" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="425" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">PLANTILLA ApacheServer</text>
  <text x="425" y="246" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Debian 13 (CLI) + Apache HTTPD</text>
  <text x="425" y="262" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">VirtualBox Guest Additions</text>
  <text x="425" y="278" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Disco ApacheServer.vdi (multiattach)</text>

  <!-- Instancias dinamicas -->
  <rect x="570" y="210" width="190" height="80" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="665" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">INSTANCIAS DINÁMICAS</text>
  <text x="665" y="246" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">VMs creadas desde plantilla</text>
  <text x="665" y="262" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Discos diferenciales (multiattach)</text>
  <text x="665" y="278" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">192.168.10.[30..254] - &lt;host&gt;.cloud.local</text>

  <!-- Conexiones -->
  <line x1="380" y1="100" x2="230" y2="210" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="425" y1="100" x2="425" y2="210" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="470" y1="100" x2="620" y2="210" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Despliegue -->
  <rect x="330" y="380" width="190" height="70" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="425" y="400" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">APLICACIÓN WEB DE GESTIÓN</text>
  <text x="425" y="416" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Interfaz web + API REST</text>
  <text x="425" y="432" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Orquestación, aprovisionamiento y despliegue</text>

  <line x1="425" y1="290" x2="425" y2="380" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="520" y1="250" x2="570" y2="250" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="280" y1="250" x2="330" y2="250" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Leyenda -->
  <text x="50" y="490" font-family="Arial, sans-serif" font-size="8">El orquestador crea instancias a partir del disco en modo multiattach, registra el nombre en Bind9 y despliega el contenido .zip en /var/www/html/</text>
</svg>
