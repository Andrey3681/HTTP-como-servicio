openapi: 3.0.3
info:
  title: HTTPaaS API - Orquestador de Servidores HTTP
  description: API REST para el aprovisionamiento automatizado de máquinas virtuales con Apache HTTP Server y DNS dinámico en Bind9.
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Soporte HTTPaaS
servers:
  - url: http://localhost:8080
    description: Servidor local de orquestación

# API local sin autenticación; se declara explícitamente para satisfacer el contrato.
security: []

paths:
  /api/instancias:
    get:
      operationId: listInstancias
      summary: Listar instancias activas
      description: Retorna la lista de todas las instancias de servidor HTTP aprovisionadas y en ejecución.
      responses:
        '200':
          description: Listado de instancias obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Instancia'
                  total:
                    type: integer
                    example: 2
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error al consultar el listado de instancias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
    post:
      operationId: createInstancia
      summary: Aprovisionar nueva instancia HTTP
      description: Crea una máquina virtual a partir del disco multiconexión, asigna red, registra el host en Bind9 y despliega el sitio web.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - nombre
                - archivo
              properties:
                nombre:
                  type: string
                  description: Subdominio deseado (ej. paisajes)
                  example: paisajes
                  pattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'
                archivo:
                  type: string
                  format: binary
                  description: Archivo .zip con el contenido estático de la página o aplicación web
      responses:
        '201':
          description: Instancia creada y aprovisionada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Instancia aprovisionada con éxito
                  datos:
                    $ref: '#/components/schemas/Instancia'
        '400':
          description: Datos de entrada inválidos o nombre de host duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error en el aprovisionamiento (VM, DNS o despliegue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/instancias/{id}:
    get:
      operationId: getInstancia
      summary: Obtener detalle de una instancia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador o nombre de la instancia
      responses:
        '200':
          description: Detalle de la instancia
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    $ref: '#/components/schemas/Instancia'
        '400':
          description: Identificador de instancia no especificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Instancia no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error al consultar la instancia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
    delete:
      operationId: deleteInstancia
      summary: Eliminar una instancia
      description: Apaga y destruye la máquina virtual, elimina los diferenciales de disco y desvincula el registro DNS en Bind9.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador de la instancia a eliminar
      responses:
        '200':
          description: Instancia destruida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Instancia eliminada exitosamente
        '400':
          description: Identificador de instancia no especificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: Instancia no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error al desmantelar recursos de la instancia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/dns/registros:
    get:
      operationId: listDnsRecords
      summary: Consultar registros DNS de la zona
      description: Retorna los registros de tipo A activos en la zona administrada (cloud.local.). Puede responder con una lista vacía cuando no hay registros o la integración de listado aún no está disponible.
      responses:
        '200':
          description: Lista de registros DNS
          content:
            application/json:
              schema:
                type: object
                properties:
                  zona:
                    type: string
                    example: cloud.local.
                  registros:
                    type: array
                    items:
                      type: object
                      properties:
                        nombre:
                          type: string
                          example: paisajes.cloud.local.
                        tipo:
                          type: string
                          example: A
                        ip:
                          type: string
                          example: 192.168.10.30
                        ttl:
                          type: integer
                          example: 300
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/logs:
    get:
      operationId: listLogs
      summary: Listar eventos de log recientes
      description: Retorna los eventos recientes del anillo de logs en memoria, con filtros opcionales.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Número máximo de eventos a retornar (más recientes).
        - name: nivel
          in: query
          required: false
          schema:
            type: string
            enum: [DEBUG, INFO, WARN, ERROR]
          description: Filtra por nivel de severidad.
        - name: componente
          in: query
          required: false
          schema:
            type: string
          description: Filtra por componente de origen.
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Cursor exclusivo; retorna eventos con id mayor al indicado.
      responses:
        '200':
          description: Eventos de log obtenidos exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogEntry'
                  total:
                    type: integer
                    example: 2
        '400':
          description: Parámetro de consulta inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
    delete:
      operationId: clearLogs
      summary: Limpiar el anillo de logs
      description: Elimina los eventos almacenados en el anillo de logs en memoria del servidor.
      responses:
        '200':
          description: Anillo de logs limpiado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Registros de log limpiados
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/logs/stream:
    get:
      operationId: streamLogs
      summary: Stream de eventos de log en tiempo real
      description: Entrega eventos de log mediante Server-Sent Events (SSE). Cada mensaje usa `id` y `data` con un objeto LogEntry en JSON. Soporta reanudación mediante `Last-Event-ID` o `since`.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Cursor exclusivo para reanudar el stream desde un id conocido.
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Id del último evento recibido (mecanismo estándar SSE de reanudación).
      responses:
        '200':
          description: Stream SSE de eventos de log
          content:
            text/event-stream:
              schema:
                type: string
                description: "Flujo SSE; cada evento contiene id y data con un objeto LogEntry en JSON."
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: El servidor no soporta streaming de eventos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/salud:
    get:
      operationId: getSalud
      summary: Comprobar salud del entorno
      description: Verifica la disponibilidad del comando VBoxManage y del servidor DNS Bind9.
      responses:
        '200':
          description: Estado de salud del sistema
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok
                  vboxmanage:
                    type: boolean
                    example: true
                  bind9:
                    type: boolean
                    example: true
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/setup/estado:
    get:
      operationId: getSetupEstado
      summary: Consultar el estado de la configuración inicial
      description: Retorna el estado de la preparación del laboratorio (ISO, red host-only, VMs ns y ApacheServer, disco multiattach).
      responses:
        '200':
          description: Estado de la preparación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupEstado'
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/setup/configuracion:
    post:
      operationId: configurarSetup
      summary: Guardar los datos del formulario de la preparación
      description: Valida y aplica usuario y contraseña. La contraseña no se persiste en disco.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupInput'
      responses:
        '200':
          description: Configuración guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Configuración de la preparación guardada
        '400':
          description: Datos inválidos (usuario o contraseña)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/setup/reiniciar:
    post:
      operationId: reiniciarSetup
      summary: Reiniciar la preparación del laboratorio
      description: Elimina las VMs base (ns y ApacheServer) y sus semillas, limpia el progreso y vuelve a detectar el entorno. Conserva la imagen descargada y la red.
      responses:
        '200':
          description: Preparación reiniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Preparación reiniciada
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: La preparación está en ejecución
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: No se pudieron eliminar las VMs base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/setup/iniciar:
    post:
      operationId: iniciarSetup
      summary: Iniciar la configuración inicial del laboratorio
      description: Arranca la secuencia de pasos en segundo plano. Es idempotente y reanuda desde el primer paso no completado.
      responses:
        '202':
          description: Configuración inicial aceptada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Configuración inicial iniciada
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Ya está en ejecución o el entorno ya está configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: No se pudo iniciar la configuración
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/setup/stream:
    get:
      operationId: streamSetup
      summary: Estado de la configuración inicial en tiempo real
      description: Entrega una instantánea del estado en cada cambio mediante Server-Sent Events. Cada mensaje usa `data` con un objeto SetupEstado en JSON.
      responses:
        '200':
          description: Stream SSE de la preparación
          content:
            text/event-stream:
              schema:
                type: string
        '405':
          description: Método HTTP no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: El servidor no soporta streaming de eventos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

components:
  schemas:
    Instancia:
      type: object
      properties:
        id:
          type: string
          example: paisajes
        nombre:
          type: string
          example: paisajes
        fqdn:
          type: string
          example: paisajes.cloud.local
        ip:
          type: string
          example: 192.168.10.30/24
        enlace:
          type: string
          example: http://paisajes.cloud.local
        estado:
          type: string
          enum: [CREANDO, ACTIVA, ERROR, ELIMINADA]
          example: ACTIVA
        creado_en:
          type: string
          format: date-time
          example: '2026-04-22T17:02:03Z'

    LogEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 42
        ts:
          type: string
          format: date-time
          example: '2026-04-22T17:02:03Z'
        nivel:
          type: string
          enum: [DEBUG, INFO, WARN, ERROR]
          example: INFO
        componente:
          type: string
          example: orchestrator
        mensaje:
          type: string
          example: Aprovisionamiento completado
        campos:
          type: object
          additionalProperties: true
          nullable: true

    ErrorRespuesta:
      type: object
      properties:
        error:
          type: string
          example: El nombre de host ya se encuentra registrado
        codigo:
          type: integer
          example: 400

    SetupInput:
      type: object
      required: [usuario, contrasena]
      properties:
        usuario:
          type: string
          pattern: '^[a-z][a-z0-9_-]{2,31}$'
          example: http
        contrasena:
          type: string
          minLength: 1
          description: Obligatoria; no se imponen requisitos de fortaleza ni se persiste en disco.
          example: httpaas

    SetupPaso:
      type: object
      properties:
        id:
          type: string
          example: iso
        nombre:
          type: string
          example: Descargar imagen Debian
        descripcion:
          type: string
          example: Imagen cloud de Debian 13 (~3 GB); se reutiliza si ya existe
        estado:
          type: string
          enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, OMITIDO]
          example: EN_CURSO
        progreso:
          type: integer
          minimum: -1
          maximum: 100
          example: 42
        mensaje:
          type: string
          example: 320 MB / 780 MB

    SetupEstado:
      type: object
      properties:
        requiere_configuracion:
          type: boolean
          example: true
        ejecutando:
          type: boolean
          example: false
        completado:
          type: boolean
          example: false
        error:
          type: string
          example: ''
        actualizado_en:
          type: string
          format: date-time
        imagen:
          type: string
          description: Ruta de la imagen cloud descargada, si existe.
          example: /var/lib/httpaas/raw/debian-13-generic-amd64.raw
        red:
          type: object
          description: Red host-only derivada de la interfaz real de VirtualBox.
          properties:
            interfaz:
              type: string
              example: vboxnet1
            ip_anfitrion:
              type: string
              example: 192.168.57.1
            mascara:
              type: string
              example: 255.255.255.0
            cidr:
              type: string
              example: 192.168.57.0/24
            ip_dns:
              type: string
              example: 192.168.57.10
            dhcp_inicio:
              type: string
              example: 192.168.57.100
            dhcp_fin:
              type: string
              example: 192.168.57.199
        configuracion:
          type: object
          properties:
            usuario:
              type: string
            lista:
              type: boolean
        pasos:
          type: array
          items:
            $ref: '#/components/schemas/SetupPaso'

