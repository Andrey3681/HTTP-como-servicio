<!DOCTYPE html>
<html class="h-full" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>HTTPaaS - Zonas DNS Bind9</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <link href="/css/stitch.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>tailwind.config={theme:{extend:{colors:{"on-surface":"#181c21","on-surface-variant":"#3e4947","surface-bright":"#f8f9ff","surface-container-lowest":"#ffffff","surface-container-low":"#f1f4fb","surface-container":"#ebeef5","primary-container":"#0f766e","secondary-container":"#e02928",outline:"#6e7977",error:"#ba1a1a"},borderRadius:{xl:"0.5rem",full:"0.75rem"}}}};</script>
</head>
<body data-page="dns" class="h-full bg-surface-container-lowest text-on-surface antialiased flex flex-col text-[14px]">
  <div id="site-header-mount"></div>

  <main class="page-main">
    <div class="page-container">
      <div class="page-title">
        <h1>Zonas DNS Bind9</h1>
        <p>Registros de tipo A en la zona local <code class="mono">cloud.local</code> (<code class="mono">GET /api/dns/registros</code>).</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        <div class="card"><div class="card-body"><div class="kv-label">Zona</div><div class="kv-value mono" id="dnsZone">cloud.local.</div></div></div>
        <div class="card"><div class="card-body"><div class="kv-label">Servidor</div><div class="kv-value mono">Bind9 / rndc</div></div></div>
        <div class="card"><div class="card-body"><div class="kv-label">Red</div><div class="kv-value mono">192.168.10.0/24</div></div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div><h2>Registros activos</h2></div>
          <div class="flex items-center gap-2">
            <button class="btn-flat" id="refreshDnsBtn" type="button"><span class="material-symbols-outlined text-[16px]">refresh</span> Actualizar</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="simple-table">
            <thead><tr><th>Nombre</th><th>Tipo</th><th>Dirección IP</th><th>TTL</th></tr></thead>
            <tbody id="dnsTableBody"><tr><td colspan="4" class="empty-state">Cargando registros…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="/js/common.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/logs-dock.js"></script>
  <script src="/js/pages/index.js"></script>
  <script src="/js/pages/dns.js"></script>
  <script src="/js/pages/salud.js"></script>
  <script src="/js/pages/detalle.js"></script>
  <script src="/js/pages/vhosts.js"></script>
  <script src="/js/pages/ayuda.js"></script>
  <script src="/js/router.js"></script>
</body>
</html>
